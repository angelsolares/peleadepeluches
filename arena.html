<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena de Peluches - Wrestling Ring</title>
    <!-- Open the CDN connections early (Three.js modules, Socket.IO) -->
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://cdn.socket.io" crossorigin>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/arena.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        
        <!-- HUD / UI Overlay -->
        <div id="hud">
            <h1 class="game-title">ARENA DE PELUCHES</h1>
            
            <!-- Tournament HUD (shown during game) -->
            <div id="tournament-hud" class="hidden">
                <div class="tournament-round-display">
                    Ronda <span id="current-round">1</span>/<span id="total-rounds">3</span>
                </div>
                <div class="round-indicators" id="round-indicators">
                    <!-- Dynamic round dots -->
                </div>
                <div id="tournament-scores">
                    <!-- Dynamic scores per player -->
                </div>
            </div>
            
            <!-- Battle royal (top right): "QUEDAN N" + elimination feed. Must follow #tournament-hud
                 (arena.css moves it below the tournament HUD when that one is visible) -->
            <div id="arena-br-panel" aria-live="polite">
                <div id="arena-remaining" class="hidden">
                    <span class="arena-remaining-label">QUEDAN</span><span class="arena-remaining-count">0</span>
                </div>
                <div id="arena-elim-feed"></div>
            </div>

            <!-- Player HUD Bars (Health + Stamina) -->
            <div id="arena-player-huds">
                <!-- Dynamic player HUDs will be inserted here -->
            </div>
            
            <!-- Controls Panel HIDDEN - Controls are on mobile -->
            <!-- Panel removed: players use their phones for controls -->
            
            <!-- Current State Display -->
            <div id="current-animation">
                <span class="label">Estado:</span>
                <span id="animation-name">Cargando...</span>
            </div>
        </div>
        
        <!-- Referee pin count ("1", "2", "3!") -->
        <div id="arena-ref-count" class="hidden" aria-live="polite"></div>
        
        <!-- Finisher cinematic: letterbox bars + move name ("¡EDGARBOMBA!") -->
        <div id="arena-finisher-cinema" class="hidden" aria-live="polite">
            <div class="cine-bar cine-top"></div>
            <div class="cine-bar cine-bottom"></div>
            <div class="arena-finisher-banner">
                <span class="arena-finisher-attacker"></span>
                <span class="arena-finisher-move"></span>
            </div>
        </div>
        
        <!-- White flash at a finisher impact -->
        <div id="arena-impact-flash"></div>
        
        <!-- "¡ESPECIAL! <player>" banners (spirit meter full) -->
        <div id="arena-special-banners" aria-live="polite"></div>
        
        <!-- Round End Overlay -->
        <div id="round-end-overlay" class="hidden">
            <h2>RONDA <span id="round-number">1</span> TERMINADA</h2>
            <div id="round-winner">¡GANADOR!</div>
            <div id="round-scores">
                <!-- Dynamic scores -->
            </div>
            <div id="next-round-countdown">
                Siguiente ronda en <span class="countdown-number" id="countdown-number">5</span>...
            </div>
        </div>
        
        <!-- Tournament End Overlay -->
        <div id="tournament-end-overlay" class="hidden">
            <div class="champion-crown">👑</div>
            <h1>¡TORNEO TERMINADO!</h1>
            <div id="tournament-champion">CAMPEÓN</div>
            <div id="tournament-final-scores">
                <!-- Dynamic final scores -->
            </div>
            <div class="tournament-end-actions">
                <button type="button" id="arena-tournament-rematch-btn" class="btn-return-menu arena-rematch-btn">REVANCHA</button>
                <button type="button" class="btn-return-menu" onclick="window.location.href='index.html'">VOLVER AL MENÚ</button>
            </div>
        </div>
        
        <!-- Loading screen -->
        <div id="loading-screen">
            <div class="loader-content">
                <div class="spinner"></div>
                <p id="loading-text">Cargando arena...</p>
                <div class="progress-bar">
                    <div id="progress-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Import maps for Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <script type="module" src="js/arena/ArenaGame.js"></script>
</body>
</html>
