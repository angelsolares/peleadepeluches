<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sumo de Peluches</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sumo.css">
    <link rel="stylesheet" href="css/party.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>

        <!-- Sumo HUD: title, timer, alive counter -->
        <div id="sumo-hud">
            <h1 class="game-title">SUMO</h1>
            <div id="sumo-timer" class="sumo-timer">1:00</div>
            <div id="sumo-alive" class="sumo-alive hidden"></div>
        </div>

        <!-- Big countdown (3, 2, 1, ¡SUMO!) -->
        <div id="sumo-countdown" class="hidden"></div>

        <!-- Banner: ¡MUERTE SÚBITA! / ¡X GANA! -->
        <div id="sumo-banner" class="sumo-banner hidden"></div>

        <!-- Tournament HUD (top right, shown during multi-round tournaments) -->
        <div id="tournament-hud" class="hidden">
            <div class="tournament-round-display">
                Ronda <span id="current-round">1</span>/<span id="total-rounds">3</span>
            </div>
            <div class="round-indicators" id="round-indicators">
                <!-- Dynamic round dots -->
            </div>
            <div id="tournament-scores">
                <!-- Dynamic scores per player -->
            </div>
        </div>

        <!-- Player list with status (vivo / fuera + placement) -->
        <div id="sumo-player-list">
            <!-- Dynamic player items -->
        </div>

        <!-- Round End Overlay (single match results + tournament rounds) -->
        <div id="round-end-overlay" class="hidden">
            <h2 id="round-title">RONDA TERMINADA</h2>
            <div id="round-winner">¡GANADOR!</div>
            <div id="round-scores">
                <!-- Dynamic ranking / scores -->
            </div>
            <div id="next-round-countdown">
                Siguiente ronda en <span class="countdown-number" id="countdown-number">5</span>...
            </div>
            <div class="round-end-actions">
                <button id="rematch-btn" class="btn-rematch" type="button">REVANCHA</button>
                <button class="btn-return-menu" type="button" onclick="window.location.href='index.html'">MENÚ</button>
            </div>
            <div id="rematch-error" class="rematch-error"></div>
        </div>

        <!-- Tournament End Overlay -->
        <div id="tournament-end-overlay" class="hidden">
            <div class="champion-crown">👑</div>
            <h1>¡TORNEO TERMINADO!</h1>
            <div id="tournament-champion">CAMPEÓN</div>
            <div id="tournament-final-scores">
                <!-- Dynamic final scores -->
            </div>
            <button class="btn-return-menu" onclick="window.location.href='index.html'">VOLVER AL MENÚ</button>
        </div>

        <!-- Loading screen -->
        <div id="loading-screen">
            <div class="loader-content">
                <div class="spinner"></div>
                <p id="loading-text">Cargando juego...</p>
                <div class="progress-bar">
                    <div id="progress-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Import maps for Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module" src="js/sumo/SumoGame.js"></script>
</body>
</html>
