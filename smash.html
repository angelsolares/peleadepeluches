<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelea de Peluches - 3D Fighter</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/party.css">

    <!-- Import maps for Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <!-- Fetch the Three.js modules in parallel instead of discovering them import by import -->
    <link rel="modulepreload" href="https://unpkg.com/three@0.160.0/build/three.module.js">
    <link rel="modulepreload" href="https://unpkg.com/three@0.160.0/examples/jsm/loaders/FBXLoader.js">
    <link rel="modulepreload" href="https://unpkg.com/three@0.160.0/examples/jsm/libs/fflate.module.js">
    <link rel="modulepreload" href="https://unpkg.com/three@0.160.0/examples/jsm/curves/NURBSCurve.js">
    <link rel="modulepreload" href="https://unpkg.com/three@0.160.0/examples/jsm/curves/NURBSUtils.js">

    <script>
        // Start downloading what the lobby needs while the JS modules load: the preview
        // character and the animation clips (same files js/main.js requests through
        // js/assets/AssetLoader.js, so the browser reuses these responses).
        (function () {
            var baby = location.search.indexOf('mode=baby_shower') !== -1;
            var files = [baby ? 'assets/bebe.fbx' : 'assets/Edgar_Model.fbx'];
            ['Walking', 'Running', 'Left_Uppercut_from_Guard', 'Boxing_Guard_Right_Straight_Kick',
             'Hit_Reaction_1', 'Shot_and_Slow_Fall_Backward', 'Block3', 'Hip_Hop_Dance'].forEach(function (name) {
                files.push('assets/anims/Meshy_AI_Animation_' + name + '_withSkin.json');
            });
            if (baby) files.push('assets/anims/Crawling.json');
            files.forEach(function (href) {
                var link = document.createElement('link');
                link.rel = 'preload';
                link.as = 'fetch';
                link.crossOrigin = 'anonymous';
                link.href = href;
                document.head.appendChild(link);
            });
        })();
    </script>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        
        <!-- HUD / UI Overlay -->
        <div id="slowmo-vignette"></div>
        <div id="hud">
            <h1 class="game-title">PELEA DE PELUCHES</h1>
            
            <!-- Tournament HUD (shown during game) -->
            <div id="tournament-hud" class="hidden">
                <div class="tournament-round-display">
                    Ronda <span id="current-round">1</span>/<span id="total-rounds">3</span>
                </div>
                <div class="round-indicators" id="round-indicators">
                    <!-- Dynamic round dots -->
                </div>
                <div id="tournament-scores">
                    <!-- Dynamic scores per player -->
                </div>
            </div>
            
            <!-- Player HUD Bars -->
            <div id="player-huds">
                <!-- Dynamic player HUDs will be inserted here -->
            </div>
            
            <!-- Controls Panel (shown in lobby/testing) -->
            <div class="controls-panel" id="controls-panel">
                <h3>⌨️ CONTROLES LOCALES</h3>
                <div class="key-bindings">
                    <div class="key-section">
                        <span class="section-title">Movimiento</span>
                        <div class="key-item"><span class="key">←</span><span class="key">→</span> Mover</div>
                        <div class="key-item"><span class="key">↑</span> / <span class="key">SPACE</span> Saltar</div>
                        <div class="key-item"><span class="key">SHIFT</span> Correr</div>
                    </div>
                    <div class="key-section">
                        <span class="section-title">Ataques</span>
                        <div class="key-item"><span class="key">J</span> Golpe</div>
                        <div class="key-item"><span class="key">K</span> Patada</div>
                    </div>
                    <div class="key-section">
                        <span class="section-title">Acciones</span>
                        <div class="key-item"><span class="key">L</span> Bloqueo (mantener)</div>
                        <div class="key-item"><span class="key">T</span> Taunt / Baile</div>
                    </div>
                </div>
            </div>
            
            <!-- Current State Display -->
            <div id="current-animation">
                <span class="label">Estado:</span>
                <span id="animation-name">Cargando...</span>
            </div>
        </div>
        
        <!-- Round End Overlay -->
        <div id="round-end-overlay" class="hidden">
            <h2>RONDA <span id="round-number">1</span> TERMINADA</h2>
            <div id="round-winner">¡GANADOR!</div>
            <div id="round-scores">
                <!-- Dynamic scores -->
            </div>
            <div id="next-round-countdown">
                Siguiente ronda en <span class="countdown-number" id="countdown-number">5</span>...
            </div>
        </div>
        
        <!-- Tournament End Overlay -->
        <div id="tournament-end-overlay" class="hidden">
            <div class="champion-crown">👑</div>
            <h1>¡TORNEO TERMINADO!</h1>
            <div id="tournament-champion">CAMPEÓN</div>
            <div id="tournament-final-scores">
                <!-- Dynamic final scores -->
            </div>
            <button id="tournament-rematch-btn" class="btn-return-menu">REVANCHA</button>
            <button class="btn-return-menu" onclick="window.location.href='index.html'">VOLVER AL MENÚ</button>
        </div>
        
        <!-- Loading screen -->
        <div id="loading-screen">
            <div class="loader-content">
                <div class="spinner"></div>
                <p id="loading-text">Cargando...</p>
                <div class="progress-bar">
                    <div id="progress-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
