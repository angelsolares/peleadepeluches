<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Mixamo</title>
    <style>
        html, body { margin: 0; height: 100%; background: #12121f; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
        .label { background: rgba(0,0,0,.6); padding: 3px 8px; border-radius: 6px; font-size: 12px; white-space: nowrap; }
        #status { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,.6); padding: 6px 10px; border-radius: 8px; font-size: 13px; z-index: 2; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="status">Cargando…</div>
    <script type="module">
        import * as THREE from 'three';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
        import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
        import { retargetMixamoClip } from '../js/animation/MixamoRetarget.js';

        const ANIMS = (new URLSearchParams(location.search).get('anims') ||
            'fighting_idle,hold_off_assailant,headbutt,illegal_knee,throw_object,falling_back,stomping,kneel,laying_breathless,getting_up,getting_up_b,getting_up_c,getting_up_d').split(',');

        const statusEl = document.getElementById('status');
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.setSize(innerWidth, innerHeight);
        document.body.appendChild(renderer.domElement);
        const labels = new CSS2DRenderer();
        labels.setSize(innerWidth, innerHeight);
        labels.domElement.style.position = 'fixed';
        labels.domElement.style.top = '0';
        labels.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labels.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.add(new THREE.HemisphereLight(0xffffff, 0x334466, 1.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.3);
        sun.position.set(3, 8, 6);
        scene.add(sun);
        scene.add(new THREE.GridHelper(30, 60, 0x445577, 0x2a2f45));

        const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
        camera.position.set(0, 7, 13);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.6, 0);
        controls.update();

        const loader = new FBXLoader();
        const load = url => new Promise((res, rej) => loader.load(url, res, undefined, rej));
        const mixers = [];
        let paused = false;

        try {
            const edgar = await load('../assets/Edgar_Model.fbx');
            const fbxs = await Promise.all(ANIMS.map(n => load(`../assets/mixamo/${n}.fbx`)));
            const cols = 5, spacingX = 2.4, spacingZ = 2.6;
            const info = [];
            ANIMS.forEach((name, i) => {
                const clip = retargetMixamoClip(edgar, fbxs[i], fbxs[i].animations[0], { name });
                const model = SkeletonUtils.clone(edgar);
                model.scale.setScalar(0.01);
                const col = i % cols, row = Math.floor(i / cols);
                model.position.set((col - (cols - 1) / 2) * spacingX, 0, (row - 1) * spacingZ);
                scene.add(model);
                const div = document.createElement('div');
                div.className = 'label';
                div.textContent = `${name} · ${clip.duration.toFixed(1)}s`;
                const label = new CSS2DObject(div);
                label.position.set(0, -10, 0);
                model.add(label);
                const mixer = new THREE.AnimationMixer(model);
                mixer.clipAction(clip).play();
                mixer.userData = { duration: clip.duration };
                mixers.push(mixer);
                info.push({ name, duration: +clip.duration.toFixed(2), tracks: clip.tracks.length });
            });
            statusEl.textContent = `Listo: ${ANIMS.length} animaciones`;
            window.__gallery = info;
        } catch (err) {
            console.error(err);
            statusEl.textContent = 'Error: ' + err.message;
            window.__galleryError = String(err);
        }

        // Debug helpers: set every animation to the same fraction of its own length
        window.__setFraction = (f) => { for (const m of mixers) m.setTime(f * m.userData.duration); };
        window.__pause = (p) => { paused = p; };
        window.__view = (x, y, z, tx, ty, tz) => { camera.position.set(x, y, z); controls.target.set(tx, ty, tz); controls.update(); };

        const clock = new THREE.Clock();
        renderer.setAnimationLoop(() => {
            const dt = clock.getDelta();
            if (!paused) for (const m of mixers) m.update(dt);
            renderer.render(scene, camera);
            labels.render(scene, camera);
        });
        addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
            labels.setSize(innerWidth, innerHeight);
        });
    </script>
</body>
</html>
